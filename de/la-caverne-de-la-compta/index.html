<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8043980001637749" crossorigin="anonymous">
  


  // ── HAMBURGER MENU ──
  function toggleMobileMenu(e) {
    e.stopPropagation();
    var nav = document.querySelector('.nav-links');
    var btn = document.querySelector('.hamburger');
    if (nav) nav.classList.toggle('mobile-open');
    if (btn) btn.classList.toggle('open');
  }
  document.addEventListener('click', function(e) {
    var nav = document.querySelector('.nav-links');
    var btn = document.querySelector('.hamburger');
    var wrap = document.querySelector('.main-nav');
    if (wrap && !wrap.contains(e.target)) {
      if (nav) nav.classList.remove('mobile-open');
      if (btn) btn.classList.remove('open');
    }
  });


  // ── LANG DROPDOWN ──
  function toggleLangMenu(e) {
    e.stopPropagation();
    document.querySelector('.lang-dropdown').classList.toggle('open');
  }
  document.addEventListener('click', function(e) {
    var ld = document.querySelector('.lang-dropdown');
    if (ld && !ld.contains(e.target)) ld.classList.remove('open');
  });

</script>
