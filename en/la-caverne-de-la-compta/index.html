  document.addEventListener('click', function(e) {

      if (nav) nav.classList.remove('mobile-open');

  // ── LANG DROPDOWN ──
  function toggleLangMenu(e) {
    e.stopPropagation();
    document.querySelector('.lang-dropdown').classList.toggle('open');

    if (ld && !ld.contains(e.target)) ld.classList.remove('open');
  });

<body><script>
function toggleDD(e) {
  e.stopPropagation();
  var wrap = document.getElementById('ddWrap');
  if (wrap) wrap.classList.toggle('dd-open');
}
function toggleLangMenu(e) {
  e.stopPropagation();
  var ls = document.getElementById('langSwitcher');

}
function toggleMobileMenu(e) {
  e.stopPropagation();

}
document.addEventListener('click', function(e) {
  var ddWrap = document.getElementById('ddWrap');
  var ls = document.getElementById('langSwitcher');
  var nav = document.querySelector('.nav-links');
  var btn = document.querySelector('.hamburger');
